  :root { --bg: #faf6ef; --ink: #241f1b; --soft: #5c534a; --rule: #e0d6c6; --link: #8a341f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1714; --ink: #f0e8dc; --soft: #bfb3a4; --rule: #3d342c; --link: #e8957a; }

  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;

  main { width: 100%; max-width: 520px; }

  p { margin: 4px 0 28px; color: var(--soft); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); }
  a { display: block; padding: 14px 2px; color: var(--link); text-decoration: none; font-weight: 600; }
  a:hover, a:focus-visible { text-decoration: underline; }
</style>
